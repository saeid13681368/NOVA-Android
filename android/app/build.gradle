plugins {
    id "com.android.application"
    id "com.chaquo.python"
}
android {
    namespace "com.nova.app"
    compileSdk 35
    defaultConfig {
        applicationId "com.nova.app"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "0.1.0"
        ndk {
            abiFilters "arm64-v8a"
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
chaquopy {
    defaultConfig {
        version = "3.13"
    }
}
