plugins {
    id "com.android.application"
    id "com.chaquo.python"
}

def novaKeystoreFile = System.getenv("NOVA_KEYSTORE_FILE")
def novaKeystorePassword = System.getenv("NOVA_KEYSTORE_PASSWORD")

android {
    namespace "com.nova.app"
    compileSdk 35

    defaultConfig {
        applicationId "com.nova.app.next"
        minSdk 24
        targetSdk 35
        versionCode 2
        versionName "0.2.0"

        ndk {
            abiFilters "arm64-v8a"
        }
    }

    signingConfigs {
        release {
            if (novaKeystoreFile != null && novaKeystorePassword != null) {
                storeFile file(novaKeystoreFile)
                storeType "PKCS12"
                storePassword novaKeystorePassword
                keyAlias "nova-release"
                keyPassword novaKeystorePassword
            }
        }
    }

    buildTypes {
        release {
            if (novaKeystoreFile != null && novaKeystorePassword != null) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

chaquopy {
    defaultConfig {
        version = "3.13"
    }
}
