name: Build NOVA Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Restore release signing key
        env:
          NOVA_KEYSTORE_BASE64: ${{ secrets.NOVA_KEYSTORE_BASE64 }}
        run: |
          test -n "$NOVA_KEYSTORE_BASE64"
          echo "$NOVA_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/nova-release.p12"

      - name: Build signed APK
        env:
          NOVA_KEYSTORE_FILE: ${{ runner.temp }}/nova-release.p12
          NOVA_KEYSTORE_PASSWORD: ${{ secrets.NOVA_KEYSTORE_PASSWORD }}
        run: |
          test -n "$NOVA_KEYSTORE_PASSWORD"
          gradle --no-daemon -p android assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-Android-Release
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
